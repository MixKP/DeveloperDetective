services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        # Busts the apk upgrade layer so a rebuild actually re-reads Alpine's index.
        # `APK_SNAPSHOT=$(date +%F) docker compose build` patches; without it a
        # cached layer can hand you last month's packages.
        APK_SNAPSHOT: ${APK_SNAPSHOT:-dev}
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    expose:
      - '3000'
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        APK_SNAPSHOT: ${APK_SNAPSHOT:-dev}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:80/']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
