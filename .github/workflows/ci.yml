name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # @dd/shared compiles to dist/, which both other workspaces resolve against.
      - name: Build shared contract
        run: npm run build -w @dd/shared

      - name: Lint (includes architecture boundary rules)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # No database, no network. That is the point of keeping the domain framework-free:
      # every business rule, the whole HTTP surface, and the answer-key contract test all
      # run here with nothing provisioned.
      - name: Test
        run: npm test

      - name: Check formatting
        run: npm run format:check

  # Integration and e2e need a real database, so they are separate jobs. Keeping them out
  # of `verify` is deliberate: that job must stay runnable with nothing provisioned.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @dd/shared

      # globalSetup creates, migrates and seeds a dedicated dd_test database.
      - name: Integration tests (Drizzle against real PostgreSQL)
        run: npm run test:integration
        env:
          TEST_ADMIN_URL: postgresql://postgres:dev@localhost:5432/postgres

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # No pooler locally, so both urls are the same. Against Supabase they differ.
      DATABASE_URL: postgresql://postgres:dev@localhost:5432/postgres
      DIRECT_DATABASE_URL: postgresql://postgres:dev@localhost:5432/postgres
      NODE_ENV: development
      API_PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @dd/shared

      - run: npx playwright install --with-deps chromium

      - name: Prepare the database
        run: npm run db:migrate && npm run db:seed

      # CI=true turns off reuseExistingServer, so Playwright starts the API and the SPA
      # itself and tears them down afterwards.
      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both images build from the repository root so the @dd/shared workspace resolves.
      - name: Build API image
        run: docker build -f backend/Dockerfile -t dd-api:ci .

      - name: Build web image
        run: docker build -f frontend/Dockerfile -t dd-web:ci .

      - name: Smoke test the API container
        run: |
          docker run -d --name dd-api-ci -p 3000:3000 \
            -e DATABASE_URL="postgresql://nobody:nothing@127.0.0.1:5432/nope" \
            -e NODE_ENV=production dd-api:ci
          sleep 8
          # A bad DSN must produce 503 + db:unreachable, not a crash. This proves the image
          # boots, serves, and reports its own health honestly.
          status=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:3000/api/health)
          cat /tmp/health.json
          test "$status" = "503"
          grep -q '"db":"unreachable"' /tmp/health.json
          curl -s http://localhost:3000/api/nope | grep -q 'NOT_FOUND'
          docker rm -f dd-api-ci
