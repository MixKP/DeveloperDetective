name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build shared contract
        run: npm run build -w @dd/shared

      - name: Lint (includes architecture boundary rules)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check formatting
        run: npm run format:check

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @dd/shared

      - name: Integration tests (Drizzle against real PostgreSQL)
        run: npm run test:integration
        env:
          TEST_ADMIN_URL: postgresql://postgres:dev@localhost:5432/postgres

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:dev@localhost:5432/postgres
      DIRECT_DATABASE_URL: postgresql://postgres:dev@localhost:5432/postgres
      NODE_ENV: development
      API_PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @dd/shared

      - run: npx playwright install --with-deps chromium

      - name: Prepare the database
        run: npm run db:migrate && npm run db:seed

      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  migrate:
    if: github.ref == 'refs/heads/main'
    needs: [verify, integration, e2e]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @dd/shared

      - name: Apply migrations and seed content
        run: npm run db:migrate && npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

  images:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: dd-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          tags: dd-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Smoke test the API container
        run: |
          docker run -d --name dd-api-ci -p 3000:3000 \
            -e DATABASE_URL="postgresql://nobody:nothing@127.0.0.1:5432/nope" \
            -e NODE_ENV=production dd-api:ci
          sleep 8
          status=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:3000/api/health)
          cat /tmp/health.json
          test "$status" = "503"
          grep -q '"db":"unreachable"' /tmp/health.json
          curl -s http://localhost:3000/api/nope | grep -q 'NOT_FOUND'
          docker rm -f dd-api-ci
