server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The SPA owns its routes. Without this, refreshing on /cases/1/investigate asks nginx
  # for a file that does not exist and returns 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets are immutable by construction; index.html must never be cached or a
  # deploy leaves browsers pointing at asset filenames that no longer exist.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Same-origin proxy. This is why the app needs no CORS configuration in production.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}
